<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<title>Wordle Multiplayer</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
		<meta name="description" content="Play Wordle Multiplayer - A real-time competitive word guessing game. Challenge friends or play solo in this exciting word puzzle." />
		<meta name="keywords" content="wordle, multiplayer, word game, remote game, puzzle, competitive wordle" />
		<meta name="author" content="https://github.com/tomlaws" />

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Wordle Multiplayer" />
		<meta property="og:description" content="Battle against friends in real-time. Who can guess the word first?" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:title" content="Wordle Multiplayer" />
		<meta property="twitter:description" content="Battle against friends in real-time. Who can guess the word first?" />

		<script>
			if (
				localStorage.theme === 'dark' ||
				(!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)
			) {
				document.documentElement.classList.add('dark');
			} else {
				document.documentElement.classList.remove('dark');
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
